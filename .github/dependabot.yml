# ktestify-plugin-archetype — Dependabot Configuration
version: 2

updates:

  # ── Maven dependencies ────────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    rebase-strategy: auto
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "deps"
      include: "scope"

    groups:
      junit5:
        applies-to: version-updates
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
      mockito:
        applies-to: version-updates
        patterns:
          - "org.mockito:*"
      logging:
        applies-to: version-updates
        patterns:
          - "org.slf4j:*"
          - "org.apache.logging.log4j:*"

  # ── Template POM dependencies (archetype-resources) ──────────────────────
  # Dependabot scans the generated project's POM template so that the
  # ktestify-core version and all dependency versions stay up-to-date.
  - package-ecosystem: maven
    directory: /src/main/resources/archetype-resources
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    rebase-strategy: auto
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - template
    commit-message:
      prefix: "deps(template)"
      include: "scope"

    groups:
      ktestify:
        applies-to: version-updates
        patterns:
          - "io.github.ktestify:*"
      cucumber:
        applies-to: version-updates
        patterns:
          - "io.cucumber:*"
      junit5:
        applies-to: version-updates
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
      mockito:
        applies-to: version-updates
        patterns:
          - "org.mockito:*"
      testcontainers:
        applies-to: version-updates
        patterns:
          - "org.testcontainers:*"
      logging:
        applies-to: version-updates
        patterns:
          - "org.slf4j:*"
          - "org.apache.logging.log4j:*"
      lombok:
        applies-to: version-updates
        patterns:
          - "org.projectlombok:*"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    rebase-strategy: auto
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    groups:
      actions-core:
        applies-to: version-updates
        patterns: [ "actions/*" ]
