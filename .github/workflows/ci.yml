name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/SECURITY.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/SECURITY.md"
  workflow_dispatch:
    inputs:
      run-integration-tests:
        description: "Run integration tests (manual opt-in, useful for PR branches)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Maven CI
    uses: ktestify/.github/.github/workflows/reusable-maven-ci.yml@main
    with:
      java-version: "25"
      run-integration-tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run-integration-tests || false }}
      maven-opts: ""

  archetype-smoke:
    name: Archetype Smoke Test
    runs-on: ubuntu-latest
    needs: [ ci ]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and install archetype
        run: mvn clean install --no-transfer-progress -Dspotless.check.skip=true

      - name: Generate project from archetype
        run: |
          mkdir -p /tmp/archetype-test
          cd /tmp/archetype-test
          mvn archetype:generate \
            -DgroupId=com.example \
            -DartifactId=test-plugin \
            -Dversion=1.0-SNAPSHOT \
            -Dpackage=com.example.testplugin \
            -DarchetypeGroupId=io.github.ktestify \
            -DarchetypeArtifactId=ktestify-plugin-archetype \
            -DarchetypeVersion=1.0-SNAPSHOT \
            -DpluginShortName=testplugin \
            -DpluginKebabId=test-plugin \
            -DpluginPascalName=TestPlugin \
            -DauthorName="CI Test" \
            -DauthorEmail="ci@test.com" \
            -DgithubOrg=test-org \
            -DgithubRepoName=ktestify-plugin-testplugin \
            -DktestifyVersion=0.1.1 \
            -DinteractiveMode=false \
            --no-transfer-progress

      - name: Compile generated project
        run: |
          cd /tmp/archetype-test/test-plugin
          mvn compile --no-transfer-progress -Dspotless.check.skip=true



